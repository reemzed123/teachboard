[package]
name = "teachboard"
version = "0.9.2"
description = "TeachBoard – סביבת הוראה דיגיטלית למורים"
edition = "2021"
publish = false
license = "UNLICENSED"

[lib]
name = "teachboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
