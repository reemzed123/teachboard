name: Windows app

# בונה את תוכנת ההתקנה ל-Windows (Tauri) על מחשב Windows של GitHub.
# בכל שינוי ב-main – קובץ התקנה להורדה (Artifacts, נשמר 30 יום).
# ביצירת Release ב-GitHub (למשל v0.9.0) – קובץ ההתקנה מצורף אליו (קבוע, להורדה נוחה).
# הפעלה ידנית עם release_tag – יוצרת Release חדש עם קובץ ההתקנה.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'גרסה לפרסום כ-Release (למשל v0.9.0). ריק = רק קובץ להורדה.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Installer file
        id: installer
        shell: bash
        run: |
          f=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "Installer: $f ($(stat -c %s "$f") bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: TeachBoard-Windows-installer
          path: ${{ steps.installer.outputs.path }}
          retention-days: 30
      - name: Attach installer to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.installer.outputs.path }}" --clobber
      - name: Publish a new release (manual run with a version)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: >
          gh release create "$TAG" "${{ steps.installer.outputs.path }}"
          --target "$GITHUB_SHA" --prerelease
          --title "TeachBoard $TAG"
          --notes "קובץ התקנה ל-Windows 10/11 (לא חתום – ראו הוראות). הוראות התקנה ורשימת בדיקה: docs/INSTALL-WINDOWS.md"
